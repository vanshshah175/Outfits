<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Saved Outfits — OUTFIT AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/wardrobe.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <div>
          <div class="sidebar-brand-row">
            <a href="/index.html" class="brand-wordmark">OUTFIT AI</a>
            <button type="button" class="icon-btn mobile-menu-btn" id="sidebar-close-btn" aria-label="Close navigation">
              <i data-lucide="x" width="18" height="18"></i>
            </button>
          </div>
          <nav class="sidebar-nav" aria-label="Workspace navigation">
            <a href="/dashboard.html" class="sidebar-link">
              <i data-lucide="layout-dashboard" width="18" height="18"></i>
              <span>Dashboard</span>
            </a>
            <a href="/wardrobe.html" class="sidebar-link">
              <i data-lucide="shirt" width="18" height="18"></i>
              <span>My Wardrobe</span>
            </a>
            <a href="/generate-outfit.html" class="sidebar-link">
              <i data-lucide="layers" width="18" height="18"></i>
              <span>Generate Outfit</span>
            </a>
            <a href="/saved-outfits.html" class="sidebar-link is-active">
              <i data-lucide="bookmark" width="18" height="18"></i>
              <span>Saved Outfits</span>
            </a>
            <a href="/profile.html" class="sidebar-link">
              <i data-lucide="user" width="18" height="18"></i>
              <span>Profile &amp; Settings</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user-chip">
            <div class="sidebar-avatar" id="sidebar-avatar">U</div>
            <div class="sidebar-user-meta">
              <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="justify-content:flex-start;" data-logout-btn>
            <i data-lucide="log-out" width="16" height="16"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation">
              <i data-lucide="menu" width="18" height="18"></i>
            </button>
            <h1 class="page-title">Saved Outfits</h1>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
            <a href="/generate-outfit.html" class="btn btn-primary btn-sm">
              <i data-lucide="plus" width="16" height="16"></i>
              <span>New Look</span>
            </a>
          </div>
        </header>

        <main class="app-content">
          <section class="toolbar-panel">
            <div class="toolbar-top-row" style="justify-content:space-between;">
              <div class="segmented-tabs">
                <button type="button" class="segmented-btn is-active" data-saved-tab="all">All Saved</button>
                <button type="button" class="segmented-btn" data-saved-tab="favorites">Favorites Only</button>
              </div>
              <select id="saved-occasion-filter" class="form-control" style="width:auto; min-width:190px;" aria-label="Filter by occasion">
                <option value="All">All Occasions</option>
              </select>
            </div>
          </section>

          <section class="outfits-grid" id="saved-outfits-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- Saved Outfit Detail Modal -->
    <div class="modal-backdrop" id="saved-detail-modal" role="dialog" aria-modal="true" aria-labelledby="saved-modal-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <div class="meta-line" id="saved-modal-meta"></div>
            <h2 id="saved-modal-title">Saved Outfit</h2>
          </div>
          <button type="button" class="icon-btn" data-close-saved-modal aria-label="Close">
            <i data-lucide="x" width="18" height="18"></i>
          </button>
        </div>

        <div class="modal-body">
          <p id="saved-modal-description" style="margin:0 0 18px; color:var(--text-secondary);"></p>
          <div class="outfit-detail-items" id="saved-modal-items"></div>
          <div class="rationale-grid">
            <div class="rationale-block">
              <h4>Color Combination</h4>
              <p id="saved-modal-harmony"></p>
            </div>
            <div class="rationale-block">
              <h4>Why This Outfit Works</h4>
              <p id="saved-modal-why"></p>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" data-close-saved-modal>Close</button>
          <button type="button" class="btn btn-danger" id="saved-modal-delete-btn">
            <i data-lucide="trash-2" width="15" height="15"></i>
            <span>Delete Saved Outfit</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/saved-outfits.js"></script>
  </body>
</html>
