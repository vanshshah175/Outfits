<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Wardrobe — OUTFIT AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/wardrobe.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <div>
          <div class="sidebar-brand-row">
            <a href="/index.html" class="brand-wordmark">OUTFIT AI</a>
            <button type="button" class="icon-btn mobile-menu-btn" id="sidebar-close-btn" aria-label="Close navigation">
              <i data-lucide="x" width="18" height="18"></i>
            </button>
          </div>
          <nav class="sidebar-nav" aria-label="Workspace navigation">
            <a href="/dashboard.html" class="sidebar-link">
              <i data-lucide="layout-dashboard" width="18" height="18"></i>
              <span>Dashboard</span>
            </a>
            <a href="/wardrobe.html" class="sidebar-link is-active">
              <i data-lucide="shirt" width="18" height="18"></i>
              <span>My Wardrobe</span>
            </a>
            <a href="/generate-outfit.html" class="sidebar-link">
              <i data-lucide="layers" width="18" height="18"></i>
              <span>Generate Outfit</span>
            </a>
            <a href="/saved-outfits.html" class="sidebar-link">
              <i data-lucide="bookmark" width="18" height="18"></i>
              <span>Saved Outfits</span>
            </a>
            <a href="/profile.html" class="sidebar-link">
              <i data-lucide="user" width="18" height="18"></i>
              <span>Profile &amp; Settings</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user-chip">
            <div class="sidebar-avatar" id="sidebar-avatar">U</div>
            <div class="sidebar-user-meta">
              <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="justify-content:flex-start;" data-logout-btn>
            <i data-lucide="log-out" width="16" height="16"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation">
              <i data-lucide="menu" width="18" height="18"></i>
            </button>
            <h1 class="page-title">My Wardrobe</h1>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
            <button type="button" class="btn btn-primary btn-sm" id="open-add-modal-btn">
              <i data-lucide="plus" width="16" height="16"></i>
              <span>Upload Garment</span>
            </button>
          </div>
        </header>

        <main class="app-content">
          <section class="toolbar-panel" aria-label="Filter wardrobe">
            <div class="toolbar-top-row">
              <div class="search-input-wrap">
                <i data-lucide="search" width="16" height="16" class="search-input-icon"></i>
                <input type="search" id="wardrobe-search" class="form-control" placeholder="Search by item name, color, or notes..." />
              </div>

              <select id="filter-color" class="form-control" style="width:auto; min-width:150px;" aria-label="Filter by color">
                <option value="All">All Colors</option>
              </select>

              <select id="filter-style" class="form-control" style="width:auto; min-width:150px;" aria-label="Filter by style">
                <option value="All">All Styles</option>
                <option value="Casual">Casual</option>
                <option value="Formal">Formal</option>
                <option value="Streetwear">Streetwear</option>
                <option value="Traditional">Traditional</option>
                <option value="Smart Casual">Smart Casual</option>
              </select>

              <span class="meta-line tabular-nums" id="wardrobe-count-label">0 items</span>
            </div>

            <div class="segmented-tabs" id="category-tabs"></div>
          </section>

          <section class="wardrobe-grid" id="wardrobe-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </section>
        </main>
      </div>
    </div>

    <!-- Add / Edit Wardrobe Item Modal -->
    <div class="modal-backdrop" id="garment-modal" role="dialog" aria-modal="true" aria-labelledby="garment-modal-title">
      <div class="modal-dialog" style="max-width:640px;">
        <div class="modal-header">
          <h2 id="garment-modal-title">Add Wardrobe Item</h2>
          <button type="button" class="icon-btn" data-close-garment-modal aria-label="Close">
            <i data-lucide="x" width="18" height="18"></i>
          </button>
        </div>

        <form id="garment-form">
          <div class="modal-body form-stack">
            <div class="upload-dropzone" id="upload-dropzone">
              <input type="file" id="item-image-input" accept="image/*" class="hidden" />
              <img id="garment-image-preview" class="upload-preview-img hidden" alt="Selected garment preview" />
              <div id="upload-placeholder" style="display:flex; flex-direction:column; align-items:center; gap:8px;">
                <i data-lucide="upload" width="24" height="24"></i>
                <strong>Click or drag a garment photo here</strong>
                <span style="font-size:0.8125rem; color:var(--text-muted);">Supports JPG, PNG, WebP (auto-optimized before upload)</span>
              </div>
            </div>

            <div class="form-group">
              <label for="item-name" class="form-label">Item name</label>
              <input type="text" id="item-name" class="form-control" placeholder="e.g., Light Blue Oxford Shirt" required maxlength="100" />
            </div>

            <div class="quick-form-grid">
              <div class="form-group">
                <label for="item-category" class="form-label">Category</label>
                <select id="item-category" class="form-control" required>
                  <option value="Shirts">Shirts</option>
                  <option value="T-Shirts">T-Shirts</option>
                  <option value="Jeans">Jeans</option>
                  <option value="Trousers">Trousers</option>
                  <option value="Shorts">Shorts</option>
                  <option value="Jackets">Jackets</option>
                  <option value="Hoodies">Hoodies</option>
                  <option value="Shoes">Shoes</option>
                  <option value="Watches">Watches</option>
                  <option value="Accessories">Accessories</option>
                </select>
              </div>

              <div class="form-group">
                <label for="item-color" class="form-label">Primary color</label>
                <input type="text" id="item-color" class="form-control" placeholder="e.g., Black, Ivory, Navy" required maxlength="40" />
              </div>

              <div class="form-group">
                <label for="item-style" class="form-label">Style</label>
                <select id="item-style" class="form-control" required>
                  <option value="Casual">Casual</option>
                  <option value="Formal">Formal</option>
                  <option value="Streetwear">Streetwear</option>
                  <option value="Traditional">Traditional</option>
                  <option value="Smart Casual">Smart Casual</option>
                </select>
              </div>

              <div class="form-group">
                <label for="item-season" class="form-label">Season</label>
                <select id="item-season" class="form-control" required>
                  <option value="All Season">All Season</option>
                  <option value="Summer">Summer</option>
                  <option value="Winter">Winter</option>
                  <option value="Monsoon">Monsoon</option>
                  <option value="Spring">Spring</option>
                  <option value="Autumn">Autumn</option>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="item-description" class="form-label">Notes &amp; fit details (optional)</label>
              <textarea id="item-description" class="form-control" placeholder="Relaxed fit cotton poplin, works well tucked or untucked..." maxlength="500"></textarea>
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-ghost" data-close-garment-modal>Cancel</button>
            <button type="submit" id="garment-submit-btn" class="btn btn-primary">Add to Wardrobe</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="/js/wardrobe.js"></script>
  </body>
</html>
