<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generate Outfit — OUTFIT AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/wardrobe.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <div>
          <div class="sidebar-brand-row">
            <a href="/index.html" class="brand-wordmark">OUTFIT AI</a>
            <button type="button" class="icon-btn mobile-menu-btn" id="sidebar-close-btn" aria-label="Close navigation">
              <i data-lucide="x" width="18" height="18"></i>
            </button>
          </div>
          <nav class="sidebar-nav" aria-label="Workspace navigation">
            <a href="/dashboard.html" class="sidebar-link">
              <i data-lucide="layout-dashboard" width="18" height="18"></i>
              <span>Dashboard</span>
            </a>
            <a href="/wardrobe.html" class="sidebar-link">
              <i data-lucide="shirt" width="18" height="18"></i>
              <span>My Wardrobe</span>
            </a>
            <a href="/generate-outfit.html" class="sidebar-link is-active">
              <i data-lucide="layers" width="18" height="18"></i>
              <span>Generate Outfit</span>
            </a>
            <a href="/saved-outfits.html" class="sidebar-link">
              <i data-lucide="bookmark" width="18" height="18"></i>
              <span>Saved Outfits</span>
            </a>
            <a href="/profile.html" class="sidebar-link">
              <i data-lucide="user" width="18" height="18"></i>
              <span>Profile &amp; Settings</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user-chip">
            <div class="sidebar-avatar" id="sidebar-avatar">U</div>
            <div class="sidebar-user-meta">
              <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="justify-content:flex-start;" data-logout-btn>
            <i data-lucide="log-out" width="16" height="16"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation">
              <i data-lucide="menu" width="18" height="18"></i>
            </button>
            <h1 class="page-title">Generate Outfit</h1>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
            <button type="button" class="btn btn-secondary btn-sm" id="regenerate-btn">
              <i data-lucide="refresh-cw" width="15" height="15"></i>
              <span>Try Another Combination</span>
            </button>
          </div>
        </header>

        <main class="app-content">
          <div class="generator-layout">
            <aside class="generator-sidebar-panel">
              <h2 class="panel-title" style="margin-bottom:14px;">Styling Preferences</h2>
              <form id="generator-form" class="form-stack">
                <div class="form-group">
                  <span class="form-label">1. Select Occasion</span>
                  <div class="occasion-grid" id="occasion-selector-grid"></div>
                </div>

                <div class="form-group">
                  <label for="gen-weather" class="form-label">2. Weather</label>
                  <select id="gen-weather" class="form-control">
                    <option value="Normal">Normal</option>
                    <option value="Hot">Hot</option>
                    <option value="Cold">Cold</option>
                    <option value="Rainy">Rainy</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="gen-style" class="form-label">3. Preferred Style</label>
                  <select id="gen-style" class="form-control">
                    <option value="Any">Match Occasion Automatically</option>
                    <option value="Casual">Casual</option>
                    <option value="Formal">Formal</option>
                    <option value="Streetwear">Streetwear</option>
                    <option value="Traditional">Traditional</option>
                    <option value="Smart Casual">Smart Casual</option>
                  </select>
                </div>

                <div class="form-group">
                  <label for="gen-color" class="form-label">4. Color Preference (optional)</label>
                  <input type="text" id="gen-color" class="form-control" placeholder="e.g., Black, Navy, Ivory" maxlength="40" />
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">
                  Generate Combinations
                </button>
              </form>
            </aside>

            <section>
              <div id="generator-notice" class="alert-box alert-warning hidden" style="margin-bottom:20px;"></div>
              <div class="outfits-grid" id="generated-outfits-grid">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <!-- Outfit Details Modal -->
    <div class="modal-backdrop" id="outfit-detail-modal" role="dialog" aria-modal="true" aria-labelledby="detail-modal-title">
      <div class="modal-dialog">
        <div class="modal-header">
          <div>
            <div class="meta-line" id="detail-modal-meta"></div>
            <h2 id="detail-modal-title">Outfit Breakdown</h2>
          </div>
          <button type="button" class="icon-btn" data-close-detail-modal aria-label="Close">
            <i data-lucide="x" width="18" height="18"></i>
          </button>
        </div>

        <div class="modal-body">
          <p id="detail-modal-description" style="margin:0 0 18px; color:var(--text-secondary);"></p>

          <div class="outfit-detail-items" id="detail-modal-items"></div>

          <div class="rationale-grid">
            <div class="rationale-block">
              <h4>Color Combination</h4>
              <p id="detail-modal-harmony"></p>
            </div>
            <div class="rationale-block">
              <h4>Why This Outfit Works</h4>
              <p id="detail-modal-why"></p>
            </div>
          </div>

          <div class="rationale-block" style="margin-top:16px;">
            <h4>Rule-Based Scoring Breakdown</h4>
            <p id="detail-modal-score-breakdown" class="tabular-nums"></p>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="detail-try-another-btn">
            <i data-lucide="refresh-cw" width="15" height="15"></i>
            <span>Try Another Combination</span>
          </button>
          <button type="button" class="btn btn-danger hidden" id="detail-remove-btn">
            <i data-lucide="trash-2" width="15" height="15"></i>
            <span>Remove from Saved Outfits</span>
          </button>
          <button type="button" class="btn btn-primary" id="detail-save-btn">
            <i data-lucide="heart" width="15" height="15"></i>
            <span>Save Outfit</span>
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="/js/outfit-generator.js"></script>
  </body>
</html>
