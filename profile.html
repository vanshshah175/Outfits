<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile &amp; Settings — OUTFIT AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/wardrobe.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <div class="app-shell">
      <aside class="app-sidebar" id="app-sidebar">
        <div>
          <div class="sidebar-brand-row">
            <a href="/index.html" class="brand-wordmark">OUTFIT AI</a>
            <button type="button" class="icon-btn mobile-menu-btn" id="sidebar-close-btn" aria-label="Close navigation">
              <i data-lucide="x" width="18" height="18"></i>
            </button>
          </div>
          <nav class="sidebar-nav" aria-label="Workspace navigation">
            <a href="/dashboard.html" class="sidebar-link">
              <i data-lucide="layout-dashboard" width="18" height="18"></i>
              <span>Dashboard</span>
            </a>
            <a href="/wardrobe.html" class="sidebar-link">
              <i data-lucide="shirt" width="18" height="18"></i>
              <span>My Wardrobe</span>
            </a>
            <a href="/generate-outfit.html" class="sidebar-link">
              <i data-lucide="layers" width="18" height="18"></i>
              <span>Generate Outfit</span>
            </a>
            <a href="/saved-outfits.html" class="sidebar-link">
              <i data-lucide="bookmark" width="18" height="18"></i>
              <span>Saved Outfits</span>
            </a>
            <a href="/profile.html" class="sidebar-link is-active">
              <i data-lucide="user" width="18" height="18"></i>
              <span>Profile &amp; Settings</span>
            </a>
          </nav>
        </div>

        <div class="sidebar-footer">
          <div class="sidebar-user-chip">
            <div class="sidebar-avatar" id="sidebar-avatar">U</div>
            <div class="sidebar-user-meta">
              <div class="sidebar-user-name" id="sidebar-user-name">Loading...</div>
              <div class="sidebar-user-email" id="sidebar-user-email"></div>
            </div>
          </div>
          <button type="button" class="btn btn-ghost btn-sm" style="justify-content:flex-start;" data-logout-btn>
            <i data-lucide="log-out" width="16" height="16"></i>
            <span>Sign Out</span>
          </button>
        </div>
      </aside>

      <div class="app-main">
        <header class="app-topbar">
          <div class="topbar-left">
            <button type="button" class="icon-btn mobile-menu-btn" id="mobile-menu-btn" aria-label="Open navigation">
              <i data-lucide="menu" width="18" height="18"></i>
            </button>
            <h1 class="page-title">Profile &amp; Settings</h1>
          </div>
          <div class="topbar-actions">
            <button type="button" class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
            <button type="button" class="btn btn-secondary btn-sm" data-logout-btn>Sign Out</button>
          </div>
        </header>

        <main class="app-content">
          <div class="profile-grid">
            <section class="surface-panel">
              <div class="profile-avatar-box" id="profile-avatar-box">U</div>
              <h2 class="panel-title" id="profile-summary-name">Wardrobe Member</h2>
              <p class="meta-line" id="profile-summary-id" style="margin-top:4px;"></p>

              <input type="file" id="profile-avatar-input" accept="image/*" class="hidden" />
              <button type="button" class="btn btn-secondary btn-sm" id="change-avatar-btn" style="margin-top:16px; width:100%;">
                <i data-lucide="camera" width="15" height="15"></i>
                <span>Update Photo</span>
              </button>
            </section>

            <section class="surface-panel">
              <h2 class="panel-title" style="margin-bottom:18px;">Account &amp; Styling Defaults</h2>
              <form id="profile-form" class="form-stack">
                <div class="form-group">
                  <label for="profile-name" class="form-label">Full name</label>
                  <input type="text" id="profile-name" class="form-control" required maxlength="80" />
                </div>

                <div class="form-group">
                  <label for="profile-login-id" class="form-label">User ID</label>
                  <input type="text" id="profile-login-id" class="form-control" disabled />
                </div>

                <div class="quick-form-grid">
                  <div class="form-group">
                    <label for="profile-default-style" class="form-label">Default Preferred Style</label>
                    <select id="profile-default-style" class="form-control">
                      <option value="Casual">Casual</option>
                      <option value="Formal">Formal</option>
                      <option value="Streetwear">Streetwear</option>
                      <option value="Traditional">Traditional</option>
                      <option value="Smart Casual">Smart Casual</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="profile-default-weather" class="form-label">Default Weather</label>
                    <select id="profile-default-weather" class="form-control">
                      <option value="Normal">Normal</option>
                      <option value="Hot">Hot</option>
                      <option value="Cold">Cold</option>
                      <option value="Rainy">Rainy</option>
                    </select>
                  </div>
                </div>

                <div style="display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-end; margin-top:8px;">
                  <button type="submit" id="profile-save-btn" class="btn btn-primary">
                    Save Profile
                  </button>
                </div>
              </form>

              <div style="margin-top:28px; padding-top:24px; border-top:1px solid var(--border-hairline);">
                <h3 style="font-size:1rem; margin-bottom:12px;">Change Password</h3>
                <form id="change-password-form" class="form-stack">
                  <div class="quick-form-grid">
                    <div class="form-group">
                      <label for="new-password" class="form-label">New password</label>
                      <input type="password" id="new-password" class="form-control" placeholder="At least 6 characters" minlength="6" required />
                    </div>
                    <div class="form-group">
                      <label for="confirm-new-password" class="form-label">Confirm new password</label>
                      <input type="password" id="confirm-new-password" class="form-control" placeholder="Repeat new password" minlength="6" required />
                    </div>
                  </div>
                  <div style="display:flex; justify-content:flex-end;">
                    <button type="submit" id="change-password-btn" class="btn btn-secondary">
                      Update Password
                    </button>
                  </div>
                </form>
              </div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="/js/profile.js"></script>
  </body>
</html>
